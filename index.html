<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meine Ziele & Notizen</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #6366f1;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        color: var(--accent);
      }
      .card {
        background: var(--card);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      input,
      textarea,
      button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
      }
      button {
        background: var(--accent);
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #334155;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎯 Meine Ziele & Notizen</h1>

      <!-- Login Bereich -->
      <div id="auth-section" class="card">
        <p>
          Melde dich an, um deine Daten auf allen Geräten zu synchronisieren:
        </p>
        <button id="login-btn">Mit Google anmelden</button>
      </div>

      <!-- App Bereich (wird nach Login sichtbar) -->
      <div id="app-section" class="hidden">
        <div class="card">
          <h3>Neues Ziel / Notiz erstellen</h3>
          <input
            type="text"
            id="title"
            placeholder="Titel (z. B. Fitness-Ziel)"
          />
          <textarea
            id="content"
            placeholder="Details oder Notizen..."
          ></textarea>
          <button id="save-btn">Speichern</button>
        </div>

        <div class="card">
          <h3>Meine Notizen & Ziele</h3>
          <div id="list">Lade Daten...</div>
        </div>

        <button id="logout-btn" style="background: #ef4444">Abmelden</button>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signInWithPopup,
        GoogleAuthProvider,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        addDoc,
        query,
        where,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // TODO: Ersetze das hier mit deinen echten Firebase-Daten aus Phase 1!
      const firebaseConfig = {
        apiKey: "AIzaSyB_0DPIDj0VPH7qExKIVh3zxw0OSDLU0LM",
        authDomain: "meine-ziele-app.firebaseapp.com",
        projectId: "meine-ziele-app",
        storageBucket: "meine-ziele-app.firebasestorage.app",
        messagingSenderId: "1082681634890",
        appId: "1:1082681634890:web:35082d760049aaf7cc36b3",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;

      // Login / Logout
      document.getElementById("login-btn").onclick = () =>
        signInWithPopup(auth, new GoogleAuthProvider());
      document.getElementById("logout-btn").onclick = () => signOut(auth);

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
          document.getElementById("auth-section").classList.add("hidden");
          document.getElementById("app-section").classList.remove("hidden");
          loadData();
        } else {
          document.getElementById("auth-section").classList.remove("hidden");
          document.getElementById("app-section").classList.add("hidden");
        }
      });

      // Speichern
      document.getElementById("save-btn").onclick = async () => {
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;
        if (!title) return alert("Bitte einen Titel eingeben!");

        await addDoc(collection(db, "items"), {
          uid: currentUser.uid,
          title,
          content,
          createdAt: new Date(),
        });

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
      };

      // Live-Synchronisation laden
      function loadData() {
        const q = query(
          collection(db, "items"),
          where("uid", "==", currentUser.uid),
        );
        onSnapshot(q, (snapshot) => {
          const list = document.getElementById("list");
          list.innerHTML = "";
          snapshot.forEach((doc) => {
            const item = doc.data();
            list.innerHTML += `<div class="item">
          <div>
            <strong>${item.title}</strong><br>
            <small style="color:var(--muted)">${item.content || ""}</small>
          </div>
        </div>`;
          });
          if (snapshot.empty)
            list.innerHTML = "<p>Noch keine Notizen vorhanden.</p>";
        });
      }
    </script>
  </body>
</html>
